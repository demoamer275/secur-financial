  <script>
  (function loadLaunchFromMultisite() {
    const MULTISITE_URL = `${window.location.origin}/data/multisite.json`;

    const getSiteName = () => {
      const match = window.location.pathname.match(/^\/sites\/([^/]+)/);
      return match ? decodeURIComponent(match[1]) : 'default';
    };

    const appendLaunchScript = (src) => {
      if (!src) {
        console.warn('[launch] No scriptURL found for site. Launch script will not be loaded.');
        return;
      }
      if (document.querySelector(`head > script[src="${src}"]`)) {
        console.info('[launch] Launch script already present:', src);
        return;
      }
      console.info('[launch] Appending Launch script:', src);
      const script = document.createElement('script');
      script.src = src;
      script.async = true;
      script.onload = () => {
        window._launchReady = true;
        document.dispatchEvent(new CustomEvent('launchReady'));
        console.info('[launch] Launch script loaded and launchReady dispatched.');
      };
      script.onerror = (error) => {
        console.warn('[launch] Launch script failed to load:', src, error);
      };
      document.head.appendChild(script);
    };

    const siteName = getSiteName();
    console.info('[launch] Fetching multisite config from:', MULTISITE_URL, 'for site:', siteName);
    fetch(MULTISITE_URL)
      .then((response) => (response.ok ? response.json() : Promise.reject(new Error(`HTTP ${response.status}`))))
      .then((json) => {
        const entry = (json?.data || []).find((row) => row && row.siteName === siteName);
        console.info('[launch] scriptURL for site', siteName, ':', entry?.scriptURL);
        appendLaunchScript(entry?.scriptURL);
      })
      .catch((error) => {
        console.warn('[launch] Failed to fetch multisite config. Launch script will not be loaded.', error);
      });
  }());
</script>
